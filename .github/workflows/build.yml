name: Build and Publish CloudStream Plugins

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # JitPack reliability: restore previously resolved dependencies so a
      # healthy run's -SNAPSHOT artifacts survive into later runs instead of
      # re-resolving against a flaky JitPack every run.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-modules-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: |
            gradle-modules-${{ runner.os }}-

      # JitPack reliability: warm the -SNAPSHOT artifacts this build depends
      # on (root POM + module POM/JAR). JitPack returns 404 while a snapshot
      # is (re)building; polling until 200 removes the "Could not find
      # com.github.recloudstream.gradle:gradle:-SNAPSHOT" configuration-phase
      # failures (root cause of CI runs #50/#51/#52/#53). The -SNAPSHOT
      # coordinate in build.gradle.kts is intentionally UNCHANGED.
      - name: Warm JitPack SNAPSHOT artifacts
        run: |
          urls=(
            "https://jitpack.io/com/github/recloudstream/gradle/-SNAPSHOT/gradle--SNAPSHOT.pom"
            "https://jitpack.io/com/github/recloudstream/gradle/gradle/-SNAPSHOT/gradle--SNAPSHOT.pom"
            "https://jitpack.io/com/github/recloudstream/gradle/gradle/-SNAPSHOT/gradle--SNAPSHOT.jar"
          )
          for url in "${urls[@]}"; do
            ok=0
            for attempt in 1 2 3 4 5; do
              code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 60 "$url") || code=000
              if [ "$code" = "200" ]; then
                echo "[warm] $url -> 200 (attempt $attempt)"
                ok=1
                break
              fi
              echo "[warm] $url -> $code (attempt $attempt); retrying in 30s"
              sleep 30
            done
            if [ "$ok" != "1" ]; then
              echo "::warning::JitPack warm-up did not reach 200 for $url; Gradle retry may still recover."
            fi
          done

      - name: Build plugins
        run: |
          chmod +x gradlew
          # JitPack reliability: a still-flaky resolution window is absorbed
          # by retrying (same SHA passed #48/#49 and failed #50/#51/#52/#53).
          for attempt in 1 2 3; do
            if ./gradlew make makePluginsJson; then
              echo "[build] gradle attempt $attempt succeeded"
              exit 0
            fi
            echo "[build] gradle attempt $attempt failed; retrying in 60s"
            sleep 60
          done
          echo "[build] gradle failed after 3 attempts"
          exit 1

      - name: Filter plugins.json by registry status
        run: |
          python3 scripts/publish_list.py build/plugins.json providers.json \
            --out build/plugins.json

      - name: Prepare builds branch
        run: |
          mkdir -p /tmp/saloo-builds
          cp repo.json /tmp/saloo-builds/repo.json

          if [ -f build/plugins.json ]; then
            cp build/plugins.json /tmp/saloo-builds/plugins.json
          fi

          find . -type f -name "*.cs3" -exec cp {} /tmp/saloo-builds/ \;

      - name: Publish builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: /tmp/saloo-builds
          force_orphan: true
