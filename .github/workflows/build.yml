name: Build CloudStream Plugins

on:
  push:
    branches:
      - main
    paths-ignore:
      - "*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build CloudStream plugins
        run: |
          ./gradlew make
          ./gradlew makePluginsJson

      - name: Show generated files
        run: |
          echo "Generated plugins:"
          find . -type f \( -name "*.cs3" -o -name "plugins.json" \) -print

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: saloo-repo-build
          path: |
            **/build/*.cs3
            build/plugins.json
          if-no-files-found: warn
