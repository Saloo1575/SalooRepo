name: Build and Publish CloudStream Plugins

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build plugins
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Prepare builds branch
        run: |
          mkdir -p /tmp/saloo-builds
          cp repo.json /tmp/saloo-builds/repo.json

          if [ -f build/plugins.json ]; then
            cp build/plugins.json /tmp/saloo-builds/plugins.json
          fi

          find . -type f -name "*.cs3" -exec cp {} /tmp/saloo-builds/ \;

      - name: Publish builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: /tmp/saloo-builds
          force_orphan: true
