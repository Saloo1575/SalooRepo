name: Build CloudStream Plugins

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build plugins
        run: |
          chmod +x gradlew
          ./gradlew make
          ./gradlew makePluginsJson

      - name: List generated files
        run: |
          echo "CS3 files:"
          find . -type f -name "*.cs3" -print
          echo "Plugin JSON:"
          find . -type f -name "plugins.json" -print

      - name: Upload CloudStream plugins
        uses: actions/upload-artifact@v4
        with:
          name: saloo-repo-build
          path: |
            **/*.cs3
            **/build/plugins.json
          if-no-files-found: error
