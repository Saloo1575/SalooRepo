name: Build and Publish CloudStream Plugins

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        # §77: android-actions/setup-android v3/v4 kirik (upstream #536 commandlinetools
        # URL 404, #537 tools paketi kaldirildi; fix release yok). GitHub ubuntu-latest
        # runner'inda Android SDK PREINSTALLED: yalnizca dogrulama + PATH, indirme yok.
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          echo "ANDROID_SDK_ROOT=${ANDROID_SDK_ROOT:-unset}"
          if [ -z "${ANDROID_HOME:-}" ] && [ -n "${ANDROID_SDK_ROOT:-}" ]; then
            export ANDROID_HOME="$ANDROID_SDK_ROOT"
          fi
          if [ -z "${ANDROID_HOME:-}" ]; then
            for cand in /usr/local/lib/android/sdk /opt/android-sdk "$HOME/android-sdk"; do
              if [ -d "$cand" ]; then export ANDROID_HOME="$cand"; break; fi
            done
          fi
          if [ -z "${ANDROID_HOME:-}" ]; then
            echo "##[error]No preinstalled Android SDK found on the runner"
            exit 1
          fi
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          for sub in platform-tools cmdline-tools/latest/bin; do
            if [ -d "$ANDROID_HOME/$sub" ]; then
              echo "$ANDROID_HOME/$sub" >> "$GITHUB_PATH"
            fi
          done
          SDKM="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -e "$SDKM" ]; then
            SDKM="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKM" ]; then
            echo "##[error]sdkmanager not found under ANDROID_HOME=$ANDROID_HOME"
            exit 1
          fi
          echo "Using sdkmanager: $SDKM"
          "$SDKM" --version

      # Restore previously resolved dependencies to speed up builds.
      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/modules-2
          key: gradle-modules-${{ runner.os }}-${{ hashFiles('build.gradle.kts', 'settings.gradle.kts') }}
          restore-keys: |
            gradle-modules-${{ runner.os }}-

      - name: Build plugins
        run: |
          chmod +x gradlew
          ./gradlew make makePluginsJson

      - name: Filter plugins.json by registry status
        run: |
          python3 scripts/publish_list.py build/plugins.json providers.json \
            --out build/plugins.json

      - name: Prepare builds branch
        run: |
          mkdir -p /tmp/saloo-builds
          cp repo.json /tmp/saloo-builds/repo.json

          if [ -f build/plugins.json ]; then
            cp build/plugins.json /tmp/saloo-builds/plugins.json
          fi

          find . -type f -name "*.cs3" -exec cp {} /tmp/saloo-builds/ \;

      - name: Publish builds branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: builds
          publish_dir: /tmp/saloo-builds
          force_orphan: true
