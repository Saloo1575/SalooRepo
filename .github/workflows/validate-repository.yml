name: Repository validation

on:
  push:
    branches: [main]
    paths:
      - 'repo.json'
      - 'plugins.json'
      - 'providers.json'
      - 'scripts/**'
      - '**/*.kt'
      - '**/*.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'repo.json'
      - 'plugins.json'
      - 'providers.json'
      - 'scripts/**'
      - '**/*.kt'
      - '**/*.kts'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle/**'
      - 'gradlew'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-metadata:
    name: Validate repository metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate repo.json / plugins.json / providers.json
        run: |
          python3 - <<'PY'
          import json
          import sys
          from pathlib import Path

          sys.path.insert(0, "scripts")
          import site_registry as reg

          repo = json.loads(Path('repo.json').read_text(encoding='utf-8'))
          required_repo = {'name', 'manifestVersion', 'pluginLists'}
          missing = required_repo - repo.keys()
          if missing:
              raise SystemExit(f'repo.json missing: {sorted(missing)}')
          if repo['manifestVersion'] != 1:
              raise SystemExit('repo.json manifestVersion must be 1')
          if not isinstance(repo['pluginLists'], list) or not repo['pluginLists']:
              raise SystemExit('repo.json pluginLists must contain at least one URL')
          if not all(isinstance(url, str) and url.startswith('https://') for url in repo['pluginLists']):
              raise SystemExit('repo.json pluginLists must contain HTTPS URLs')

          plugins = json.loads(Path('plugins.json').read_text(encoding='utf-8'))
          if not isinstance(plugins, list):
              raise SystemExit('plugins.json must be a JSON array')
          required_plugin = {'url', 'status', 'version', 'apiVersion', 'name', 'internalName', 'authors'}
          names = set()
          for index, plugin in enumerate(plugins):
              missing = required_plugin - plugin.keys()
              if missing:
                  raise SystemExit(f'plugins[{index}] missing: {sorted(missing)}')
              if not isinstance(plugin['url'], str) or not plugin['url'].startswith('https://'):
                  raise SystemExit(f"plugins[{index}].url must be an HTTPS URL")
              if plugin['internalName'] in names:
                  raise SystemExit(f"duplicate internalName: {plugin['internalName']}")
              names.add(plugin['internalName'])
          print(f'Validated {len(plugins)} plugin entries.')

          registry = json.loads(Path('providers.json').read_text(encoding='utf-8'))
          problems = reg.validate_registry(registry)
          if problems:
              raise SystemExit('providers.json invalid: %s' % '; '.join(problems))
          count = len(registry.get('providers', []))
          print(f'Validated {count} site records (registry v{reg.REGISTRY_VERSION}).')
          PY

      - name: Enforce publish policy (no INACTIVE entries in plugins.json)
        run: |
          if [ -f plugins.json ] && [ -s plugins.json ]; then
            python3 scripts/publish_list.py plugins.json providers.json --check
          else
            echo "plugins.json absent/empty; publish policy trivially satisfied."
          fi

      - name: Run registry unit tests
        run: python3 scripts/test_registry.py

  build-providers:
    name: Build providers
    needs: validate-metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect Gradle wrapper
        id: gradle
        run: echo \"present=$([ -f gradlew ] && echo true || echo false)\" >> $GITHUB_OUTPUT
      - uses: actions/setup-java@v4
        if: steps.gradle.outputs.present == 'true'
        with:
          distribution: temurin
          java-version: '17'
      - name: Build CloudStream providers
        if: steps.gradle.outputs.present == 'true'
        run: chmod +x gradlew && ./gradlew --no-daemon make
