name: Source Discovery

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

# contents: write is consumed only when AUTO_ADD_NEW_SITES is enabled
# (registry update + provider module scaffold). The gate defaults to "false",
# so scheduled runs stay read-only apart from candidate issues.
permissions:
  contents: write
  issues: write

env:
  # Pipeline gate: new sites are NEVER auto-added while this is "false".
  AUTO_ADD_NEW_SITES: "false"

jobs:
  discovery:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run discovery pipeline
        id: pipeline
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess
          import sys

          sys.path.insert(0, "scripts")
          import site_registry as reg

          AUTO_ADD = os.environ.get("AUTO_ADD_NEW_SITES", "false").lower() == "true"
          registry_changed = False

          data = reg.load_registry("providers.json")
          problems = reg.validate_registry(data)
          if problems:
              raise SystemExit("registry invalid: %s" % "; ".join(problems))

          # ---------------------------------------------------------- S1: DISCOVERY
          # Curated, safe candidate sources only. The list lives in
          # scripts/discovery_sources.json so new sources are added by a
          # reviewed commit, never by runtime discovery itself. Pirated-
          # content sites are never added. The built-in list below is the
          # fallback when the file is missing or unreadable.
          candidate_sources = [
              {"name": "Internet Archive", "url": "https://archive.org", "reason": "Public media/archive API", "contentTypes": ["movie", "documentary"]},
              {"name": "Wikimedia Commons", "url": "https://commons.wikimedia.org", "reason": "Public media repository", "contentTypes": ["documentary"]},
              {"name": "media.ccc.de", "url": "https://media.ccc.de", "reason": "Public conference video platform", "contentTypes": ["documentary"]},
          ]
          sources_file = pathlib.Path("scripts/discovery_sources.json")
          if sources_file.exists():
              try:
                  loaded = json.loads(sources_file.read_text(encoding="utf-8"))
                  loaded_sources = []
                  for s in loaded.get("sources", []):
                      if not (isinstance(s, dict) and s.get("name") and s.get("url")):
                          continue
                      declared = [
                          reg.normalize_content_type(value)
                          for value in (s.get("contentTypes") or [])
                      ]
                      loaded_sources.append({
                          "name": s["name"], "url": s["url"],
                          "reason": s.get("reason", ""),
                          "contentTypes": [t for t in declared if t],
                      })
                  if loaded_sources:
                      candidate_sources = loaded_sources
                      print(f"[SOURCES] {len(candidate_sources)} curated sources from discovery_sources.json")
              except (json.JSONDecodeError, KeyError) as exc:
                  print(f"[WARN] discovery_sources.json unreadable ({exc}); using built-in list")

          report = []
          new_candidates = []
          policy_rejections = []

          for candidate in candidate_sources:
              candidate["contentTypes"] = candidate.get("contentTypes") or []
              # ---------------------------------------------- S2: DOMAIN NORMALIZE
              domain = reg.normalize_domain(candidate["url"])
              registered = reg.registered_domain(domain)
              candidate["domain"] = domain
              candidate["registeredDomain"] = registered

              # ------------------------------- S3 + S4: DUPLICATE / EXISTING SITE CHECK
              owner, match_type = reg.find_provider_by_domain(data, domain)
              if owner is not None:
                  report.append((candidate, "EXISTING", f"tracked as {owner['siteId']} ({match_type})"))
                  continue

              # ---------------------------------------------- S5: DOMAIN CHANGE CHECK
              # Domain moves of tracked sites are owned by domain-check.yml; a
              # candidate matching no record and no alias is genuinely new here.

              # ---------------------------------------------------- S6: ACTIVE CHECK
              probe = reg.check_site({"url": candidate["url"], "probePath": "/"}, retries=1)
              candidate["reachable"] = probe["status"] in ("active", "degraded")
              candidate["probeStatus"] = probe["status"]
              candidate["finalDomain"] = probe.get("final_domain")
              if not candidate["reachable"]:
                  report.append((candidate, "DEAD", str(probe.get("error"))))
                  continue

              # ------------------------------------ S6b: MIRROR / SAME-SITE CHECK
              # Different registered domain, same content: the probe's <title>
              # matched a stored titleSignature -> an alias of an existing
              # record, NEVER a new provider (prevents mirror duplicates).
              mirrors = reg.find_provider_by_title(data, probe.get("title"))
              if mirrors:
                  owner = mirrors[0]
                  candidate["mirrorOf"] = owner.get("siteId")
                  report.append(
                      (candidate, "MIRROR",
                       f"same content as {owner.get('siteId')} (title signature matched)")
                  )
                  if AUTO_ADD:
                      reg.add_alias(data, owner["siteId"], candidate["domain"])
                      reg.save_registry("providers.json", data)
                      registry_changed = True
                      print(f"[ALIAS]   {candidate['domain']} -> {owner['siteId']} aliases")
                  continue

              # ------------------------------------ S6c: CONTENT POLICY CHECK
              # Only movie / series / anime / cartoon / documentary pass.
              # Live TV/IPTV, cameras, radio, adult content, sports, betting
              # and anything outside the allowlist is rejected outright.
              policy_reason = reg.content_policy_violation({
                  "name": candidate["name"],
                  "url": candidate["url"],
                  "title": probe.get("title"),
                  "contentTypes": candidate.get("contentTypes") or [],
              })
              if policy_reason:
                  candidate["rejectedBy"] = policy_reason
                  policy_rejections.append(candidate)
                  report.append((candidate, "REJECTED",
                                 f"content policy: {policy_reason}"))
                  continue

              # ------------------------------------------------------- S7: DECISION
              new_candidates.append(candidate)
              report.append((candidate, "NEW", "not tracked yet"))

          for candidate, decision, note in report:
              print(f"[{decision:<8}] {candidate['name']} {candidate['url']} -> {note}")

          if not new_candidates:
              print("No new candidates found.")
              outputs_path = os.environ.get("GITHUB_OUTPUT")
              if outputs_path:
                  with open(outputs_path, "a", encoding="utf-8") as handle:
                      handle.write("changed=false\n")
              raise SystemExit(0)

          def open_issue_exists(title):
              result = subprocess.run(
                  ["gh", "issue", "list", "--state", "open", "--json", "title"],
                  capture_output=True, text=True, check=False,
              )
              try:
                  titles = [item.get("title", "") for item in json.loads(result.stdout or "[]")]
              except json.JSONDecodeError:
                  titles = []
              return title in titles

          def scaffold_provider_module(entry):
              """S9 helper: create a minimal provider module from the
              ExampleProvider template. Only called when AUTO_ADD is on."""
              package = entry["siteId"].replace("-", "")
              class_name = "".join(part.capitalize() for part in entry["siteId"].split("-"))
              module_dir = pathlib.Path(class_name)
              src = pathlib.Path("ExampleProvider/src/main/kotlin/com/example/ExampleProvider.kt")
              dst = module_dir / "src" / "main" / "kotlin" / "com" / "saloo" / "sites" / package
              dst.mkdir(parents=True, exist_ok=True)
              code = src.read_text(encoding="utf-8")
              code = code.replace("package com.example", f"package com.saloo.sites.{package}")
              code = code.replace("class ExampleProvider", f"class {class_name}Provider")
              code = code.replace("https://example.com/", entry["url"])
              code = code.replace('override var name = "Example provider"', f'override var name = "{entry["name"]}"')
              # content-type policy: supportedTypes comes from the record's
              # contentTypes via the registry library (5 allowlisted CloudStream
              # TvTypes; untyped placeholders stay policy-compliant)
              supported = ", ".join(
                  f"TvType.{name}" for name in reg.tv_types_for(entry.get("contentTypes"))
              ) or "TvType.Movie"
              code = code.replace("setOf(TvType.Movie)", f"setOf({supported})")
              (dst / f"{class_name}Provider.kt").write_text(code, encoding="utf-8")
              plugin = (
                  f"package com.saloo.sites.{package}\n\n"
                  "import android.content.Context\n"
                  "import com.lagradost.cloudstream3.plugins.CloudstreamPlugin\n"
                  "import com.lagradost.cloudstream3.plugins.Plugin\n\n"
                  "@CloudstreamPlugin\n"
                  f"class {class_name}Plugin : Plugin() {{\n"
                  "    override fun load(context: Context) {\n"
                  f"        registerMainAPI({class_name}Provider())\n"
                  "    }\n"
                  "}\n"
              )
              (dst / f"{class_name}Plugin.kt").write_text(plugin, encoding="utf-8")
              (module_dir / "src" / "main" / "AndroidManifest.xml").write_text(
                  '<?xml version="1.0" encoding="utf-8"?>\n<manifest />', encoding="utf-8"
              )
              tv_types_literal = ", ".join(
                  f'"{name}"' for name in reg.tv_types_for(entry.get("contentTypes"))
              ) or '"Movie"'
              gradle = (
                  "version = 1\n\n"
                  "cloudstream {\n"
                  '    authors = listOf("Saloo1575")\n'
                  '    language = "tr"\n'
                  f'    description = "Auto-scaffolded provider module for {entry["name"]}"\n'
                  "    status = 1\n"
                  f"    tvTypes = listOf({tv_types_literal})\n"
                  "}\n"
              )
              (module_dir / "build.gradle.kts").write_text(gradle, encoding="utf-8")
              print(f"[SCAFFOLD] {module_dir} created (picked up by settings.gradle.kts auto-include)")
              return class_name

          # -------------------------------------------------- S8: REGISTRY UPDATE
          if not AUTO_ADD:
              body_lines = ["# SalooRepo Source Candidates", ""]
              for candidate in new_candidates:
                  body_lines.append(f"## {candidate['name']}")
                  body_lines.append(f"- URL: `{candidate['url']}`")
                  body_lines.append(f"- Domain: `{candidate['domain']}` (registered: `{candidate['registeredDomain']}`)")
                  body_lines.append(f"- Reason: {candidate['reason']}")
                  body_lines.append(f"- Reachable: {candidate['reachable']}")
                  body_lines.append(f"- Probe status: {candidate.get('probeStatus')}")
                  body_lines.append(f"- Final domain: `{candidate.get('finalDomain') or 'n/a'}`")
                  if candidate.get("mirrorOf"):
                      body_lines.append(f"- MIRROR of: `{candidate['mirrorOf']}`")
                  if candidate.get("contentTypes"):
                      body_lines.append(
                          f"- Declared types: {', '.join(candidate['contentTypes'])}"
                      )
                  body_lines.append("")
              if policy_rejections:
                  body_lines.append("## İçerik politikası gereği reddedilen adaylar")
                  body_lines.append("")
                  for candidate in policy_rejections:
                      body_lines.append(
                          f"- {candidate['name']} (`{candidate['url']}`): "
                          f"{candidate.get('rejectedBy')}"
                      )
                  body_lines.append("")
              body_lines.append(
                  "Candidates only. Nothing was added automatically "
                  "(AUTO_ADD_NEW_SITES=false). Review license, API availability and "
                  "technical suitability before implementation."
              )
              body_lines.append(
                  "Implementation needed: YES. Auto-scaffold only creates a placeholder "
                  "MainAPI module; real scraping code must be implemented before listing."
              )
              title = "New source candidates detected"
              if not open_issue_exists(title):
                  subprocess.run(
                      ["gh", "issue", "create", "--title", title,
                       "--body", "\n".join(body_lines), "--label", "source-discovery"],
                      check=False,
                  )
              print("Auto-add is disabled; candidates reported as an issue.")
              raise SystemExit(0)

          added_modules = []
          for candidate in new_candidates:
              # ------------------------------------------- S8: REGISTRY UPDATE (gated)
              extra = (
                  {"contentTypes": candidate["contentTypes"]}
                  if candidate.get("contentTypes")
                  else None
              )
              try:
                  entry = reg.add_provider(
                      data, candidate["name"], candidate["url"],
                      category="official", extra=extra,
                  )
              except reg.DuplicateSiteError as exc:
                  # A concurrent run won the race; never crash, never double-add.
                  report.append((candidate, "EXISTING", str(exc)))
                  print(f"[SKIP]    duplicate appeared mid-run: {exc}")
                  continue
              reg.save_registry("providers.json", data)
              registry_changed = True
              print(f"[ADDED]   {entry['siteId']} -> providers.json")

              # ------------------------------------------- S9: PROVIDER CREATION
              # Scaffolded modules are PLACEHOLDERS (template MainAPI with the
              # base url swapped): they compile but fetch no content. A real
              # scraping implementation must be added by a human before the
              # plugin is worth listing in plugins.json.
              module_name = scaffold_provider_module(entry)
              if module_name:
                  added_modules.append(module_name)

              # ------------------------------- S11: VALIDATION, S12: PLUGINS.JSON/REPO.JSON
              print("[NEXT]    validate-repository.yml runs the registry tests; build.yml "
                    "compiles the module, publishes *.cs3 and regenerates plugins.json / "
                    "repo.json on the builds branch")

          if added_modules or registry_changed:
              problems = reg.validate_registry(data)
              if problems:
                  raise SystemExit("registry invalid after discovery: %s" % "; ".join(problems))

          outputs_path = os.environ.get("GITHUB_OUTPUT")
          if outputs_path:
              with open(outputs_path, "a", encoding="utf-8") as handle:
                  if added_modules or registry_changed:
                      handle.write("changed=true\n")
                      if added_modules:
                          handle.write("modules=" + " ".join(added_modules) + "\n")
                  else:
                      handle.write("changed=false\n")
          PY

      - name: Commit discovery results (registry + scaffolded modules)
        if: steps.pipeline.outputs.changed == 'true'
        run: |
          git config user.name "saloo-automation"
          git config user.email "actions@users.noreply.github.com"
          git add providers.json
          if [ -n "${{ steps.pipeline.outputs.modules }}" ]; then
            for module in ${{ steps.pipeline.outputs.modules }}; do
              git add "$module"
            done
          fi
          git commit -m "feat(discovery): new source(s) registered [skip ci]"
          git pull --rebase origin main
          git push

      - name: Trigger rebuild (publish .cs3 + filtered plugins.json)
        if: steps.pipeline.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml
