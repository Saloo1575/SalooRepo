name: Provider Health Check

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check Internet Archive provider
        shell: bash
        run: |
          python - <<'PY'
          import json
          import sys
          import urllib.parse
          import urllib.request

          def get_json(url):
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "SalooRepo-HealthCheck/1.0"}
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  if response.status < 200 or response.status >= 400:
                      raise RuntimeError(f"HTTP {response.status}")
                  return json.loads(response.read().decode("utf-8"))

          # 1. Internet Archive search API
          search_params = urllib.parse.urlencode({
              "q": "mediatype:movies",
              "fl[]": "identifier",
              "rows": "1",
              "output": "json"
          })

          search_url = f"https://archive.org/advancedsearch.php?{search_params}"
          search_data = get_json(search_url)

          docs = search_data.get("response", {}).get("docs", [])

          if not docs:
              raise RuntimeError("Search API returned no usable result.")

          identifier = docs[0].get("identifier")

          if not identifier:
              raise RuntimeError("Search API returned no identifier.")

          print(f"[OK] Search API returned identifier: {identifier}")

          # 2. Metadata API
          metadata_url = f"https://archive.org/metadata/{identifier}"
          metadata = get_json(metadata_url)

          metadata_block = metadata.get("metadata", {})

          if not isinstance(metadata_block, dict):
              raise RuntimeError("Metadata API returned an invalid metadata object.")

          print(f"[OK] Metadata API responded for: {identifier}")

          # 3. Minimal checks used by our provider
          if "title" not in metadata_block and "title" not in metadata:
              print("[WARN] Metadata response has no title field.")
          else:
              print("[OK] Metadata contains title information.")

          print("Internet Archive provider health check PASSED.")
          PY
