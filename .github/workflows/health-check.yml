name: Provider Health Check

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

# contents: write -> commits status changes back into providers.json
# issues:  write  -> opens an issue when a site becomes INACTIVE
permissions:
  contents: write
  issues: write

jobs:
  health-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check every registry site (ACTIVE / DEGRADED / INACTIVE)
        id: probe
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          sys.path.insert(0, "scripts")
          import site_registry as reg

          data = reg.load_registry("providers.json")
          problems = reg.validate_registry(data)
          if problems:
              raise SystemExit("registry invalid: %s" % "; ".join(problems))

          def open_issue_exists(title):
              result = subprocess.run(
                  ["gh", "issue", "list", "--state", "open", "--json", "title"],
                  capture_output=True, text=True, check=False,
              )
              try:
                  titles = [item.get("title", "") for item in json.loads(result.stdout or "[]")]
              except json.JSONDecodeError:
                  titles = []
              return title in titles

          meaningful_changes = False
          transitions = []

          for provider in reg.providers(data):
              site_id = provider.get("siteId")
              if provider.get("enabled") is False:
                  print(f"[SKIP]    {site_id}: manually disabled")
                  continue

              before = provider.get("status")
              # canonical domain first, lastWorkingDomain as fallback (registry)
              probe = reg.check_site(provider)
              changed = reg.apply_check_result(provider, probe)
              after = provider["status"]

              print(
                  f"[{after.upper():<8}] {site_id}: url={provider.get('url')} "
                  f"error={probe.get('error')}"
              )
              if changed:
                  meaningful_changes = True
              if before != after:
                  transitions.append((site_id, before, after, probe.get("error")))

          if meaningful_changes:
              problems = reg.validate_registry(data)
              if problems:
                  raise SystemExit("registry invalid after update: %s" % "; ".join(problems))
              reg.save_registry("providers.json", data)
              print("Registry updated.")
          else:
              print("No status changes; providers.json left untouched.")

          # INACTIVE never removes a site from the registry; it only flips the
          # status so the site can return to ACTIVE on a later run.
          for site_id, before, after, error in transitions:
              if after == "inactive" and before != "inactive":
                  title = f"Site INACTIVE: {site_id}"
                  body = (
                      f"Site `{site_id}` transitioned **{before} -> {after}**.\n\n"
                      f"Last error: `{error}`\n\n"
                      "The registry record is kept; the site returns to ACTIVE automatically "
                      "when it becomes reachable again."
                  )
                  if open_issue_exists(title):
                      print(f"[ISSUE]   open issue already exists: {title}")
                  else:
                      subprocess.run(
                          ["gh", "issue", "create", "--title", title,
                           "--body", body, "--label", "health-change"],
                          check=False,
                      )
                      print(f"[ISSUE]   created: {title}")
              elif after == "active" and before == "inactive":
                  print(f"[RECOVER] {site_id}: back to ACTIVE (no issue opened)")

          outputs_path = os.environ.get("GITHUB_OUTPUT")
          if outputs_path:
              with open(outputs_path, "a", encoding="utf-8") as handle:
                  handle.write("changed=" + ("true" if meaningful_changes else "false") + "\n")
          PY

      - name: Commit registry status changes
        id: commit
        run: |
          if git diff --quiet providers.json; then
            echo "No registry changes to commit."
            echo "committed=false" >> "$GITHUB_OUTPUT"
          else
            git config user.name "saloo-automation"
            git config user.email "actions@users.noreply.github.com"
            git add providers.json
            git commit -m "chore(registry): health status update [skip ci]"
            git pull --rebase origin main
            git push
            echo "committed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger publish refresh (drop INACTIVE from plugins.json)
        if: steps.commit.outputs.committed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run build.yml
