name: Domain Change Check

on:
  schedule:
    - cron: "47 3 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  domain-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check provider domains
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import json
          import subprocess
          import urllib.request
          from urllib.parse import urlparse

          with open("providers.json", encoding="utf-8") as f:
              data = json.load(f)

          providers = data.get("providers", [])

          for provider in providers:
              if not provider.get("enabled", True):
                  continue

              name = provider.get("name", "Unknown")
              url = provider.get("url")

              if not url:
                  continue

              old_domain = urlparse(url).netloc

              try:
                  req = urllib.request.Request(
                      url,
                      headers={"User-Agent": "SalooRepo-DomainCheck/1.0"}
                  )

                  with urllib.request.urlopen(req, timeout=20) as response:
                      final_url = response.geturl()

                  new_domain = urlparse(final_url).netloc

                  if new_domain and new_domain != old_domain:
                      title = f"Domain changed: {name}"
                      body = (
                          f"Provider: **{name}**\n\n"
                          f"Configured URL: `{url}`\n\n"
                          f"Detected final URL: `{final_url}`\n\n"
                          f"Detected domain change: `{old_domain}` → `{new_domain}`"
                      )

                      subprocess.run(
                          [
                              "gh", "issue", "create",
                              "--title", title,
                              "--body", body,
                              "--label", "domain-change"
                          ],
                          check=False
                      )

                      print(f"[DOMAIN-CHANGED] {name}: {old_domain} -> {new_domain}")
                  else:
                      print(f"[OK] {name}: {old_domain}")

              except Exception as e:
                  print(f"[CHECK-FAILED] {name}: {e}")
          PY
